<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAFRA - Register</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo"><a href="../index.html" style="color:white; text-decoration:none;">KAFRA</a></h1>
            <nav>
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="cart.html">Cart</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html" class="active">Register</a></li>
                    <li><a href="profile.html">My Profile</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container" style="max-width: 500px; margin-top: 20px; padding: 20px;">
            <h1>User Registration</h1>
            <form action="#" method="post">
                <div>
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div>
                    <label for="confirm_password">Confirm Password:</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </div>
                <div>
                    <button type="submit" class="button" style="width:100%;">Register</button>
                </div>
            </form>
            <p class="mt-1">Already have an account? <a href="login.html">Login here</a></p>
            <p><a href="../index.html">Back to Home</a></p>
        </div>
    </main>

    <footer style="margin-top: 20px;"> {/* Adjusted footer margin for potentially longer page */}
        <div class="container">
            <p>&copy; 2023 KAFRA Vegetable Shop. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
